<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050509">
<title>Для Жанель</title>
<style>
:root { --ground: #050509; --ink: #f5ece6; --red: #e8112d; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(520px circle at 50% 18%, rgba(232, 17, 45, 0.18), transparent 70%);
}
.avatar {
  position: relative; z-index: 1; flex: none;
  width: clamp(96px, 28vw, 140px); aspect-ratio: 1; border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(245, 236, 230, 0.85);
  box-shadow: 0 0 0 6px rgba(232, 17, 45, 0.25), 0 12px 40px rgba(232, 17, 45, 0.35);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; transform: scale(3.2); transform-origin: 36% 33%; display: block; }
.stage { position: relative; z-index: 1; flex: 1; width: 100%; max-width: 560px; display: grid; place-items: center; min-height: 0; padding-top: 24px; }
.video {
  position: relative; width: fit-content; max-width: 100%; max-height: 100%; border-radius: 20px; overflow: hidden;
  background: #000; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.video video { display: block; width: auto; max-width: 100%; height: auto; max-height: calc(100dvh - 220px); filter: brightness(0.72); }
.video video { pointer-events: none; }
/* photo burst that replaces the picture (sound keeps playing) once the "во всех вселенных" subtitle is over */
.flash { position: absolute; inset: 0; z-index: 1; display: none; background: #000; pointer-events: none; }
.flash.on { display: block; }
.flash img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; filter: brightness(0.72); }
.hint { position: fixed; z-index: 2; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); margin: 0; text-align: center; font-size: 13px; letter-spacing: 0.04em; color: rgba(245, 236, 230, 0.6); pointer-events: none; }
/* light darkening veil over the video */
.video::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: rgba(5, 5, 9, 0.22); }
</style>
</head>
<body>
<div class="avatar"><img src="../img/portrait.jpg" alt="Жанель"></div>
<main class="stage">
  <div class="video">
    <video id="v" src="video.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture controlslist="nodownload noremoteplayback"></video>
    <div class="flash" id="flash" aria-hidden="true"><img id="fi" alt=""></div>
  </div>
  <p class="hint" id="hint">нажми, чтобы включить звук</p>
</main>
<script>
// Browsers only allow autoplay with sound after a tap: try with sound first, fall back to muted, unmute on first touch.
const v = document.getElementById("v"), hint = document.getElementById("hint");
function unmute() {
  v.muted = false; v.volume = 1;
  v.play().then(() => hint.remove()).catch(() => { v.muted = true; });
}
// Photo burst: after the subtitle (ends ~7.2s) flip through every photo, spread evenly over the rest of the clip.
const START = 7.2;
const PHOTOS = [
  ...Array.from({ length: 36 }, (_, i) => "../img/s/" + String(i + 1).padStart(2, "0") + ".jpg"),
  ...["portrait", "hero-red", "dior", "cap", "fire", "street", "art", "statue", "petronas", "leaves", "trees"].map(n => "../img/" + n + ".jpg"),
];
PHOTOS.forEach(src => { new Image().src = src; });
const flash = document.getElementById("flash"), fi = document.getElementById("fi");
let shown = -1;
function tick() {
  const t = v.currentTime, dur = v.duration || 19.9;
  if (t >= START) {
    const step = (dur - START) / PHOTOS.length;
    const i = Math.min(PHOTOS.length - 1, Math.floor((t - START) / step));
    if (i !== shown) { fi.src = PHOTOS[i]; shown = i; }
    flash.classList.add("on");
  } else if (shown !== -1) { flash.classList.remove("on"); shown = -1; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

v.muted = false;
v.play().then(() => hint.remove()).catch(() => { v.muted = true; v.play().catch(() => {}); });
["pointerdown", "keydown"].forEach(e => addEventListener(e, () => { if (v.muted || v.paused) unmute(); }, { once: false }));
</script>
</body>
</html>
